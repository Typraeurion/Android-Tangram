plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.xmission.trevin.android.tangram'
    compileSdk = 37

    buildToolsVersion = "37.0.0"

    /**
     * The defaultConfig block encapsulates default settings and entries
     * for all build variants and can override some attributes in
     * main/AndroidManifest.xml dynamically from the build system.
     * You can configure product flavors to override these values for
     * different versions of your app.
     */

    defaultConfig {
        // Uniquely identifies the package for publishing.
        applicationId = "com.xmission.trevin.android.tangram"

        // Defines the minimum API level required to run the app.
        // Current minimum is Marshmallow (Android 6)
        minSdk = 23

        // Specifies the API level used to test the app.
        // Current target is Cinnamon Bun (Android 17)
        targetSdk = 37

        // Defines the version number of your app.
        versionCode = 80101

        // Defines a user-friendly version name for your app.
        versionName = "0.8.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
        }
        release {
            optimization {
                enable = false
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    aaptOptions {
        // This may be needed to work around a reproducibility issue
        // where PNG optimization does not provide deterministic output.
        cruncherEnabled = false
    }

    lintOptions {
        disable 'UnusedResources'

        // Workaround for issues with Android Studio
        // complaining about not targeting the latest SDK
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.documentfile

    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit

    testImplementation libs.junit
    // Real org.json implementation so JSON puzzle parsing can be
    // exercised in JVM unit tests (the android.jar stub throws).
    testImplementation libs.json
}

configurations.all {
    // Since Kotlin 1.8 the JDK7/JDK8 standard-library classes were merged
    // into the main kotlin-stdlib artifact, so any transitively-pulled
    // kotlin-stdlib-jdk7 / -jdk8 modules collide with kotlin-stdlib and
    // produce "Duplicate class" errors.  Excluding the obsolete artifacts
    // resolves this without pinning a Kotlin version (which would otherwise
    // break AGP's bundled lint, that requires a newer Kotlin runtime).
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

tasks.register('generateCustomJavadoc', Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath += files(android.getBootClassPath().join(File.pathSeparator))
    destinationDir = file(layout.buildDirectory.dir("docs/javadoc").get().asFile)
    options {
        // Inject MathJax script to format LaTeX markup on page render.
        header = '<script id="MathJav-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>'
    }
}
